name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test tools
        run: pip install pytest fastapi uvicorn

      - name: Verify Code Formatting
        run: make fmt-check

      - name: Verify File Size Discipline (<= 450 lines)
        run: make line-check

      - name: Go Vet
        run: make vet

      - name: Run Unit Tests
        run: make test-unit

      - name: Run Security Test Suite
        run: make test-security

      - name: Run Durability Test Suite
        run: make test-durability

      - name: Run Scale Test Suite
        run: make test-scale

      - name: Run End-to-End Integration Tests
        run: make test-e2e

      - name: Run Contrib Runtime Tests (Go & TypeScript)
        run: make test-contrib

      - name: Build Foundation CLI & Reference Plugins
        run: make build
